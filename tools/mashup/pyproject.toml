[project]
name = "mashup"
version = "0.1.0"
description = "Turn a creator-owned video/podcast archive into coherent themed mashups using only existing clips."
authors = [{ name = "Sarthak Agrawal", email = "sarthakagrawal927@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.11,<7",
    "httpx>=0.28.1",
    "numpy>=2.1.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "rich>=13.9.0",
    "tenacity>=9.0.0",
    "typer>=0.15.0",
]

[project.optional-dependencies]
# Local subtitle generation for archives that ship without SRT/VTT.
# Apple-silicon only; the rest of the pipeline never imports these.
transcribe = ["mlx-whisper>=0.4.2"]
# In-process embeddings — the default backend. Kept optional so that a
# gateway-only install stays light, but present in the dev group below so a
# plain `uv sync` gets a working default.
local = ["torch>=2.4.0", "transformers>=4.44.0"]
# In-process chat for enrichment. Apple silicon only, which is why the chat
# backend defaults to the gateway everywhere else.
localchat = ["mlx-lm>=0.28.0; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
mashup = "mashup.cli:app"

[build-system]
requires = ["uv_build>=0.5.0,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "torch>=2.4.0",
    "transformers>=4.44.0",
    "mlx-lm>=0.28.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.build-backend]
module-root = "src"
module-name = "mashup"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
